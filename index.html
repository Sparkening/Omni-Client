<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni Client</title>
    <script type="module" src="/src/main.ts" defer></script>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div class="launcher-container">
      
      <nav class="sidebar">
        <button class="nav-btn"><i class="fi fi-br-home"></i></button>
        <button class="nav-btn"><i class="fi fi-br-apps"></i></button>
        <button class="nav-btn"><i class="fi fi-br-settings"></i></button>
        <button class="nav-btn theme-btn"><i class="fi fi-br-moon"></i></button>
      </nav>

      <main class="content">
        <!-- Scrollable Dashboard Area -->
        <div class="dashboard-scroll">
          
          <!-- Welcoming Header Banner -->
          <header class="expressive-header">
            <div class="header-text">
              <span class="user-greeting-chip">Ready to roll</span>
              <h1 class="welcome-title">Welcome back, <span id="player-username">Mika</span>.</h1>
              <p class="welcome-sub">Jump right back into your world or spin up an instance.</p>
            </div>
          </header>

          <!-- Jump In: Quick Cards -->
          <section class="section-block">
            <div class="section-header">
              <h2>Jump In</h2>
              <span class="badge-count">3 active</span>
            </div>

            <!-- Handled dynamically by main.ts -->
            <div class="jump-in-list"></div>
          </section>

          <!-- Library Grid Section -->
          <section class="section-block">
            <div class="section-header">
              <h2>Library</h2>
              <div class="library-actions">
                <button class="chip-btn"><i class="fi fi-br-apps-add"></i> New Instance</button>
              </div>
            </div>
            
            <!-- Handled dynamically by main.ts -->
            <div class="library-grid"></div>
            
          </section>
        </div>

        <!-- Docked Bottom Action Bar -->
        <div class="action-bar">
          <div class="custom-select">
            <div class="split-btn-group">
              <button class="select-main-btn">
                <span>My 1.20.4 Pack</span>
              </button>
              <button class="select-trigger-btn">
                <i class="fi fi-br-angle-small-down"></i>
              </button>
            </div>

            <div class="select-options">
              <div class="option"><i class="fi fi-br-box"></i> My 1.20.4 Pack</div>
              <div class="option"><i class="fi fi-br-cube"></i> Vanilla 1.8.9</div>
              <div class="option"><i class="fi fi-br-hammer"></i> Fabric Mods</div>
            </div>
          </div>

          <button class="play-btn">PLAY</button>
        </div>
      </main>

    </div>
  </body>
</html>
